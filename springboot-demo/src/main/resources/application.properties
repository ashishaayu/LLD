spring.application.name=springboot-demo
server.port=${PORT:8081}
spring.mvc.problemdetails.enabled=true
outbound.base-url=${OUTBOUND_BASE_URL:http://localhost:${server.port}}
outbound.connect-timeout=2s
outbound.read-timeout=5s
logging.level.root=INFO
logging.level.com.example.interview=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
